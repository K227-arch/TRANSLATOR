# /etc/nginx/sites-available/lunyoro-translator
#
# Nginx reverse proxy for the Lunyoro Translator Pi.
# Routes 5 missing endpoints to the Python sidecar (port 8001),
# everything else goes to the C++ backend (port 8080).
#
# The C++ backend must be reconfigured to listen on 8080 instead of 80.
# Nginx takes over port 80 as the public-facing entry point.

upstream cpp_backend {
    server 127.0.0.1:8080;
}

upstream python_sidecar {
    server 127.0.0.1:8001;
}

server {
    listen 80 default_server;
    server_name _;

    # Max upload size for image/PDF uploads
    client_max_body_size 12M;

    # ── Routes handled by the Python sidecar ──────────────────────────────────

    location /classify-image {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /translate-batch {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # batch can take a while
    }

    location /translate-batch-file {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /summarize-pdf {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /language-rules {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /chat {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # ── Everything else → C++ backend ─────────────────────────────────────────

    location / {
        proxy_pass http://cpp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
