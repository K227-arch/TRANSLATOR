version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Pi-Sim Stack — Raspberry Pi 5 AI Stick virtual environment
#
# Runs on a completely isolated Docker network (pisim_net) so it never
# touches the original dev stack (lunyoro-translator_default network).
# All four services communicate only over pisim_net; nothing leaks out.
#
# Services:
#   pi-sim-ollama    Port 11434  Ollama LLM server (qwen2.5:1.5b)
#   pi-sim-backend   Port 8080   Python ORT (NLLB INT8 ONNX)
#   pi-sim-sidecar   Port 8001   Python FastAPI (batch, PDF, classify, chat)
#   pi-sim-nginx     Port 8090   Nginx router
#   pi-sim-frontend  Port 3090   Next.js static frontend
#
# Usage (from inside lunyoro-translator/pi-sim/):
#   docker compose --project-name pi-sim -f docker-compose.pi-sim.yml up --build
#
# Then open: http://localhost:3090  (full UI)
#            http://localhost:8090  (API via nginx)
# ──────────────────────────────────────────────────────────────────────────────

networks:
  pisim_net:
    driver: bridge
    name: pisim_net
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:

  # ── Ollama LLM server — qwen2.5:1.5b (~1 GB Q4_K_M) ──────────────────────
  # Mirrors what runs on the Pi AI Stick: Ollama + a small chat model.
  # Model is stored in the pisim_ollama named volume so it survives restarts
  # and is only downloaded once.
  # Pull the model after first start:
  #   docker exec pi-sim-ollama ollama pull qwen2.5:1.5b
  pi-sim-ollama:
    image: ollama/ollama:latest
    container_name: pi-sim-ollama
    networks:
      - pisim_net
    ports:
      - "11436:11434"   # host 11436 → container 11434 (avoids clash with dev-stack Ollama on 11435)
    volumes:
      - pisim_ollama:/root/.ollama   # model weights persist across restarts
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "24h"       # keep model loaded in RAM between requests
      OLLAMA_NUM_PARALLEL: "1"       # Pi has 1 CPU core dedicated — no parallelism
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g      # qwen2.5:1.5b Q4 needs ~1 GB; 2g gives headroom

  # ── Backend: Python ORT — greedy NLLB INT8 ONNX ───────────────────────────
  pi-sim-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pi-sim-backend:latest
    container_name: pi-sim-backend
    networks:
      - pisim_net
    ports:
      - "8080:8080"
    volumes:
      - ../backend/model:/models:ro
      - ../backend:/backend:ro
      - pisim_history:/tmp/pisim
    environment:
      MODEL_DIR: /models
      BACKEND_DIR: /backend
      HISTORY_FILE: /tmp/pisim/history.json
      CORS_ORIGINS: "http://localhost:3090,http://localhost:8090,http://pi-sim-frontend:3000,http://pi-sim-nginx:80"
      NLLB_INT8_DIR: "nllb_{d}_int8"
      NLLB_THREADS: "4"
      LOG_LEVEL: INFO
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 6
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g

  # ── Sidecar: batch / PDF / classify / chat / language-rules ─────────────────
  pi-sim-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    image: pi-sim-sidecar:latest
    container_name: pi-sim-sidecar
    networks:
      - pisim_net
    ports:
      - "8001:8001"
    volumes:
      - pisim_mobilenet:/app/models/mobilenet_v2
    environment:
      CPP_BACKEND_URL: "http://pi-sim-backend:8080"
      # Ollama is now a sibling container on pisim_net — reach by service name
      OLLAMA_URL: "http://pi-sim-ollama:11434"
      OLLAMA_MODEL: "qwen2.5:1.5b"
      TRANSFORMERS_OFFLINE: "1"
      LOG_LEVEL: INFO
    depends_on:
      pi-sim-backend:
        condition: service_healthy
      pi-sim-ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  # ── Nginx router ───────────────────────────────────────────────────────────
  pi-sim-nginx:
    image: nginx:1.27-alpine
    container_name: pi-sim-nginx
    networks:
      - pisim_net
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pi-sim-backend:
        condition: service_healthy
      pi-sim-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ── Frontend: Next.js ──────────────────────────────────────────────────────
  pi-sim-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8090"
    image: pi-sim-frontend:latest
    container_name: pi-sim-frontend
    networks:
      - pisim_net
    ports:
      - "3090:3000"
    depends_on:
      - pi-sim-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 5

volumes:
  pisim_history:
    name: pisim_history
  pisim_mobilenet:
    name: pisim_mobilenet
  pisim_ollama:
    name: pisim_ollama    # persists Ollama model weights across stack restarts
