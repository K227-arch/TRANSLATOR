# pi-sim nginx config
# ─────────────────────────────────────────────────────────────────────────────
# Mirrors pi-sidecar/nginx-translator.conf exactly.
# Routes sidecar endpoints to pi-sim-sidecar:8001,
# everything else to pi-sim-backend:8080.
#
# Host port 8090 → this nginx → port 80 inside container

upstream cpp_backend {
    server pi-sim-backend:8080;
}

upstream python_sidecar {
    server pi-sim-sidecar:8001;
}

server {
    listen 80 default_server;
    server_name _;

    # Max upload size for image/PDF uploads — matches Pi setting
    client_max_body_size 12M;

    # ── Routes handled by the Python sidecar ─────────────────────────────────

    location /classify-image {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /translate-batch {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /translate-batch-file {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /summarize-pdf {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /language-rules {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /chat {
        proxy_pass http://python_sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # ── Everything else → pi-sim-backend (C++ surface) ────────────────────────

    location / {
        proxy_pass http://cpp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        # Allow long NLLB greedy decode on slow machines
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
